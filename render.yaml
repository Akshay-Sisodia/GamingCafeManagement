# Render Blueprint — deploys the full cloud tier:
#   api (web service) + worker (background worker) + managed Postgres + Redis.
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: gcm-postgres
    databaseName: gamingcafe
    plan: free
    postgresMajorVersion: "16"

services:
  # ---- API (REST + SSE) -------------------------------------------------------
  - type: web
    name: gcm-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    preDeployCommand: pnpm --filter server db:push
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gcm-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false # set the SAME strong secret on gcm-api and gcm-worker when prompted
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  # ---- Worker (BullMQ consumers: command expiry, session sweeps) ---------------
  - type: worker
    name: gcm-worker
    runtime: docker
    plan: starter
    dockerCommand: ["pnpm", "--filter", "worker", "start"]
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gcm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gcm-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false # set the same value as gcm-api so tokens validate across services
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  # ---- Redis (BullMQ queues + SSE pub/sub fan-out) ------------------------------
  - type: keyvalue
    name: gcm-redis
    plan: free
    maxmemoryPolicy: noeviction # BullMQ requires no eviction
