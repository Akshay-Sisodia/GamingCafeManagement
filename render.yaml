# Render Blueprint — deploys gcm-api (web service) + gcm-worker (background worker).
# Postgres and Redis are HOSTED externally (Neon / Upstash / Redis Cloud etc.) —
# paste their connection strings when Render prompts at deploy time.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---- API (REST + SSE) -------------------------------------------------------
  - type: web
    name: gcm-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    preDeployCommand: pnpm --filter server db:push
    envVars:
      - key: DATABASE_URL
        sync: false # e.g. postgres://…@ep-xxx.neon.tech/gamingcafe?sslmode=require
      - key: REDIS_URL
        sync: false # e.g. redis://…  or  rediss://… (TLS auto-detected)
      - key: JWT_SECRET
        sync: false # set the SAME strong secret on gcm-api and gcm-worker
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

  # ---- Worker (BullMQ consumers: command expiry, session sweeps) ---------------
  - type: worker
    name: gcm-worker
    runtime: docker
    plan: starter
    dockerCommand: ["pnpm", "--filter", "worker", "start"]
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # same value as gcm-api
      - key: REDIS_URL
        sync: false # same value as gcm-api
      - key: JWT_SECRET
        sync: false # same value as gcm-api
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
