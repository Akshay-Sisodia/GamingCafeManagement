# Render Blueprint — FREE tier deployment (single service).
#
# Runs api + BullMQ workers in ONE process (SINGLE_PROCESS=true) so the whole
# backend fits inside Render's 750 free instance-hours.
#
# Data services are hosted externally (Neon / Upstash / Redis Cloud) — paste
# their connection strings when Render prompts at deploy time.
#
# Keep-alive: pair with a free cron pinging /healthz every 10 minutes
# (cron-job.org or UptimeRobot) to defeat the 15-min idle spin-down.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.

services:
  - type: web
    name: gcm-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # Schema sync + startup handled by the image entrypoint
    # (free tier has no preDeployCommand support).
    envVars:
      - key: SINGLE_PROCESS
        value: "true" # api + workers in one process (free-tier friendly)
      - key: DATABASE_URL
        sync: false # e.g. postgres://…@ep-xxx.neon.tech/gamingcafe?sslmode=require
      - key: REDIS_URL
        sync: false # redis://… or rediss://… (TLS auto-detected)
      - key: JWT_SECRET
        sync: false # strong random value, e.g. openssl rand -hex 32
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
