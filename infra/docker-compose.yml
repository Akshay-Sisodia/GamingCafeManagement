services:
  postgres:
    image: postgres:16-alpine
    container_name: gcm-postgres
    environment:
      POSTGRES_USER: gcm
      POSTGRES_PASSWORD: gcm-dev-password
      POSTGRES_DB: gamingcafe
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gcm -d gamingcafe"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gcm-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
